[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-etl-pipelines"
version = "0.1.0"
description = "ETL pipelines using Google Cloud services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["calculator"]